name: Gotham patrol (snake + surveillance report)

on:
  # redraw every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # allow manual runs from the Actions tab
  workflow_dispatch:
  # and on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gotham-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snake eats the contribution graph (amber on dark, amber on light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#B8860B&color_dots=#EBEDF0,#FFE8A3,#FFD45C,#E6AC00,#B8860B
            dist/github-snake-dark.svg?color_snake=#FFC300&color_dots=#161B22,#4D3B00,#8C6A00,#CC9A00,#FFC300

      - name: Draw the surveillance report (live stats card)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/surveillance.mjs dist/surveillance.svg

      - name: Make sure the card exists even if the API call failed
        run: test -s dist/surveillance.svg || node .github/scripts/surveillance.mjs dist/surveillance.svg --offline

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
