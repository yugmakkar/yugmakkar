<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none" role="img" aria-label="Yug - creative thinker and AI leverager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="0.5" stop-color="#C77DFF"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="cubeOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A98C"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="cubeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="cubePurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D0A9FF"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <style>
      @keyframes drift1 { 0%,100%{transform:translate(0px,0px)} 50%{transform:translate(55px,-28px)} }
      @keyframes drift2 { 0%,100%{transform:translate(0px,0px)} 50%{transform:translate(-48px,38px)} }
      @keyframes drift3 { 0%,100%{transform:translate(0px,0px)} 50%{transform:translate(34px,44px)} }
      @keyframes bob  { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-12px)} }
      @keyframes bob2 { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(10px)} }
      @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes fade { 0%{opacity:0;transform:translateY(14px)} 100%{opacity:1;transform:translateY(0px)} }
      @keyframes grow { 0%{transform:scaleX(0)} 100%{transform:scaleX(1)} }
      @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.9} }
      .b1{animation:drift1 9s ease-in-out infinite}
      .b2{animation:drift2 12s ease-in-out infinite}
      .b3{animation:drift3 15s ease-in-out infinite}
      .bob {transform-box:fill-box;transform-origin:center;animation:bob 6s ease-in-out infinite}
      .bob2{transform-box:fill-box;transform-origin:center;animation:bob2 7.5s ease-in-out infinite}
      .spinA{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
      .spinB{transform-box:fill-box;transform-origin:center;animation:spin 34s linear infinite reverse}
      .kick {animation:fade 0.9s ease-out 0.05s both}
      .title{animation:fade 1.1s ease-out 0.2s both}
      .sub  {animation:fade 1.1s ease-out 0.5s both}
      .underline{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out 0.7s both}
      .star {animation:twinkle 3.2s ease-in-out infinite}
      .star2{animation:twinkle 4.1s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>

  <!-- drifting gradient blobs (mesh vibe) -->
  <g filter="url(#soft)" opacity="0.55">
    <circle class="b1" cx="250" cy="130" r="120" fill="#D97757"/>
    <circle class="b2" cx="980" cy="240" r="150" fill="#4CC9F0"/>
    <circle class="b3" cx="640" cy="80"  r="120" fill="#7B61FF"/>
  </g>

  <!-- twinkling particles -->
  <g fill="#ffffff">
    <circle class="star"  cx="520" cy="70"  r="2.4"/>
    <circle class="star2" cx="760" cy="250" r="2"/>
    <circle class="star"  cx="860" cy="60"  r="1.8"/>
    <circle class="star2" cx="430" cy="270" r="2.2"/>
    <circle class="star"  cx="1140" cy="120" r="2"/>
    <circle class="star2" cx="60"  cy="190" r="2"/>
  </g>

  <!-- isometric floating cubes (3D feel) -->
  <g transform="translate(980,150)">
    <g class="bob">
      <g class="spinA">
        <path d="M0,-34 L46,-8 L0,18 L-46,-8 Z" fill="url(#cubeOrange)"/>
        <path d="M-46,-8 L0,18 L0,70 L-46,44 Z" fill="#9c5540"/>
        <path d="M46,-8 L0,18 L0,70 L46,44 Z"   fill="#c06b4f"/>
      </g>
    </g>
  </g>

  <g transform="translate(1092,246)">
    <g class="bob2">
      <g class="spinB" transform="scale(0.62)">
        <path d="M0,-34 L46,-8 L0,18 L-46,-8 Z" fill="url(#cubeBlue)"/>
        <path d="M-46,-8 L0,18 L0,70 L-46,44 Z" fill="#2f7fa0"/>
        <path d="M46,-8 L0,18 L0,70 L46,44 Z"   fill="#3ba3cc"/>
      </g>
    </g>
  </g>

  <g transform="translate(905,278)">
    <g class="bob">
      <g class="spinB" transform="scale(0.42)">
        <path d="M0,-34 L46,-8 L0,18 L-46,-8 Z" fill="url(#cubePurple)"/>
        <path d="M-46,-8 L0,18 L0,70 L-46,44 Z" fill="#53409c"/>
        <path d="M46,-8 L0,18 L0,70 L46,44 Z"   fill="#6450c0"/>
      </g>
    </g>
  </g>

  <!-- text block -->
  <g class="kick">
    <circle cx="84" cy="98" r="5" fill="#D97757"/>
    <text x="100" y="104" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="5" fill="#9aa4b2">CREATIVE TECHNOLOGIST</text>
  </g>

  <g class="title">
    <text x="78" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="104" fill="url(#txt)" filter="url(#glow)">YUG</text>
  </g>

  <rect class="underline" x="82" y="222" width="286" height="7" rx="3.5" fill="url(#line)"/>

  <g class="sub">
    <text x="84" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#e6edf3">creative thinker <tspan fill="#D97757" font-weight="700">&#215;</tspan> AI leverager</text>
  </g>
</svg>
