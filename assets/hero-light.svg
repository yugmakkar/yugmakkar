<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="Yug - creative thinker and AI leverager">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="1" stop-color="#218BFF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="1" stop-color="#218BFF"/>
    </linearGradient>
    <linearGradient id="cTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54AEFF"/>
      <stop offset="1" stop-color="#218BFF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D8DEE4"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="54"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <style>
      @keyframes drift1 { 0%,100%{transform:translate(0px,0px)} 50%{transform:translate(42px,-22px)} }
      @keyframes drift2 { 0%,100%{transform:translate(0px,0px)} 50%{transform:translate(-38px,26px)} }
      @keyframes bob  { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-10px)} }
      @keyframes bob2 { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(8px)} }
      @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes fade { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0px)} }
      @keyframes grow { 0%{transform:scaleX(0)} 100%{transform:scaleX(1)} }
      .b1{animation:drift1 12s ease-in-out infinite}
      .b2{animation:drift2 15s ease-in-out infinite}
      .bob {transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite}
      .bob2{transform-box:fill-box;transform-origin:center;animation:bob2 9s ease-in-out infinite}
      .spinA{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
      .spinB{transform-box:fill-box;transform-origin:center;animation:spin 52s linear infinite reverse}
      .kick {animation:fade 0.9s ease-out 0.05s both}
      .title{animation:fade 1.1s ease-out 0.2s both}
      .sub  {animation:fade 1.1s ease-out 0.5s both}
      .underline{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out 0.7s both}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#FFFFFF"/>

    <!-- soft blue glows -->
    <g filter="url(#soft)" opacity="0.22">
      <circle class="b1" cx="300" cy="150" r="130" fill="#218BFF"/>
      <circle class="b2" cx="980" cy="210" r="150" fill="#54AEFF"/>
    </g>

    <!-- subtle dot grid -->
    <rect width="1200" height="300" fill="url(#dots)" opacity="0.9"/>

    <!-- floating isometric cubes -->
    <g transform="translate(985,128)">
      <g class="bob"><g class="spinA">
        <path d="M0,-32 L44,-8 L0,16 L-44,-8 Z" fill="url(#cTop)"/>
        <path d="M-44,-8 L0,16 L0,64 L-44,40 Z" fill="#0A4DA6"/>
        <path d="M44,-8 L0,16 L0,64 L44,40 Z"   fill="#1266CC"/>
      </g></g>
    </g>
    <g transform="translate(1090,214)">
      <g class="bob2"><g class="spinB" transform="scale(0.6)">
        <path d="M0,-32 L44,-8 L0,16 L-44,-8 Z" fill="#218BFF"/>
        <path d="M-44,-8 L0,16 L0,64 L-44,40 Z" fill="#0A4DA6"/>
        <path d="M44,-8 L0,16 L0,64 L44,40 Z"   fill="#1266CC"/>
      </g></g>
    </g>
    <g transform="translate(905,236)">
      <g class="bob"><g class="spinB" transform="scale(0.4)">
        <path d="M0,-32 L44,-8 L0,16 L-44,-8 Z" fill="#54AEFF"/>
        <path d="M-44,-8 L0,16 L0,64 L-44,40 Z" fill="#0A4DA6"/>
        <path d="M44,-8 L0,16 L0,64 L44,40 Z"   fill="#1266CC"/>
      </g></g>
    </g>

    <!-- text -->
    <g class="kick">
      <circle cx="82" cy="86" r="4.5" fill="#0969DA"/>
      <text x="98" y="92" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="5" fill="#656D76">CREATIVE TECHNOLOGIST</text>
    </g>
    <g class="title">
      <text x="76" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="96" fill="url(#title)" filter="url(#glow)">YUG</text>
    </g>
    <rect class="underline" x="80" y="204" width="268" height="6" rx="3" fill="url(#line)"/>
    <g class="sub">
      <text x="82" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#1F2328">creative thinker <tspan fill="#0969DA" font-weight="700">&#215;</tspan> AI leverager</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#D0D7DE" stroke-width="1"/>
  </g>
</svg>
